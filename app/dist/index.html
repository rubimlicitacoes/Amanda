<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Reinos — ENEM 2026</title>
<meta name="theme-color" content="#141A2E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Reinos" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icone.svg" />
<link rel="icon" href="icone.svg" />
<link rel="stylesheet" href="app.css?v=15" />
<style>
  html,body{margin:0;padding:0;background:#F6F7FB}
  #diag{display:none;position:fixed;inset:0;z-index:9999;background:#F6F7FB;padding:24px;
    font:13px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#96253C;overflow:auto}
  #diag pre{white-space:pre-wrap;word-break:break-word;font:11.5px/1.5 ui-monospace,monospace;
    background:#FCE8EC;border:1px solid #F2C9D2;border-radius:12px;padding:14px}
</style>
<script>
  window.addEventListener('error', function(e){
    var d=document.getElementById('diag'); if(!d) return;
    d.style.display='block';
    d.innerHTML='<strong>Erro ao iniciar</strong><pre>'+
      ((e.message||'')+'\n'+(e.filename||'')+' linha '+(e.lineno||'?')+'\n'+
       (e.error&&e.error.stack?e.error.stack.split('\n').slice(0,8).join('\n'):''))+'</pre>';
  }, true);
</script>
</head>
<body>
<div id="diag"></div>
<div id="raiz"></div>
<script src="app.js?v=15"></script>
</body>
</html>
